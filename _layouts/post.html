---
layout: default
---
{% if page.image and page.headerImage %}
    <img class="title-image" src="{{ page.image }}" alt="{{ page.title }}">
{% endif %}

<h1 class="title">{{ page.title }}</h1>

<span class="date">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%A. %B %d, %Y' }}</time>
</span>

{{ content }}
