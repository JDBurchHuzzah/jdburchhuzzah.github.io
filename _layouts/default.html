<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {% feed_meta %}
  <style>{% capture sheet %}{% if site.dark-theme == 'auto' %}{% include style.scss %}@media(prefers-color-scheme:dark){ {% include style-dark.scss %} }{% elsif site.dark-theme %}{% include style-dark.scss %}{% else %}{% include style.scss %}{% endif %}{% endcapture %}{{ sheet | scssify }}</style>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrapper-large site-shell">
    {% include header.html %}
    <main id="main" class="site-main {{ page.title | slugify }}" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </div>
</body>
</html>
